  # чтобы будущие security-кейсы (дизайн следующим /qa-loop) тегировались
  # реальными id, а не приблизительной привязкой, и чтобы фичи были видны в
  # coverage_map «Фичи без единого кейса» как непокрытые (прямой вход needs-design).
  # Скоуп минимальный (решение владельца 2026-07-14): статическая инспекция
  # манифеста + adb-пробы; НЕ полный аудит (§8). Одна запись = один распознаваемый
  # класс проверки (bullet'ы §9 security), сверено с кодом:
