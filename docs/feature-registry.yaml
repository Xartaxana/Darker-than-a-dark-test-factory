  # хранятся там же, чтобы не потеряться. Общие для обеих фич факты кода:
  # обработчик один (capture-листенер :1152-1166), активен только при
  # window.__ao3TapToScroll и только на pathname ^/works/\d (:1153-1154) —
  # на листингах зон нет; guard :1155 отсекает по WHITELIST ТЕГОВ
  # ('a, button, input, select, textarea, label, summary, [role="button"]'),
  # а не по наличию обработчика, и средняя ветка — единственная без
  # preventDefault (:1161-1164, return до него) ⇒ узел вне whitelist со своим
  # обработчиком получает ОБА потребителя одного тапа (проба CH-005
  # СИНТЕТИЧЕСКАЯ, 2/2 + контроль; на живом AO3 такой узел не предъявлен).
  # РЕШЕНИЕ ВЛАДЕЛЬЦА 2026-07-28 (docs/01 §10 (н), вариант 1): guard получает
  # СОБСТВЕННУЮ запись bridge-tap-zone-guard (см. блок AO3-bridge) и пробу
  # предпосылки в canary-области — прежняя заметка «отдельной записью не
  # оформляю» этим отменена. Причина отдельной записи: Then guard'а («тап по
  # интерактивному узлу НЕ запускает зональное действие») наблюдаемо отличается
  # от Then обеих зональных фич, а тегирование canary-кейса на browse-tap-*
  # ложно зачитало бы те фичи покрытыми (прецедент перетеггинга НФ-областей).
  # ОБЕ записи ниже с 2026-07-28 подняты в P1 docs/01 §9 (решение владельца
  # §10 (т): «тумблер, покрытый только on-путём» = системный пробел) — метки
  # needs-design стоят на области «browser/settings: reading-UX жесты и их
  # тумблеры — ОБЕ стороны каждого тумблера».
