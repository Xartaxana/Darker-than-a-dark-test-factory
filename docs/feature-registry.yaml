  # ── Синхронизация библиотеки (GitLab snippet) ─────────────────────────────
  # ОДИННАДЦАТЬ записей ниже — новая подсистема сборки 59be96c6 (коммит 24b7b13a
  # завёл синхронизацию через общую папку, 59be96c6 заменил транспорт на приватный
  # GitLab-сниппет; в HEAD общей папки НЕТ — см. шапку файла). Заведены
  # test-strategist 2026-08-15, у всех 0 кейсов. Дробление по правилу шапки: у
  # подсистемы принципиально разные Then (конфиг ↔ ручной прогон ↔ ошибки ↔
  # создание сниппета ↔ слияние строк ↔ распространение удалений ↔ судьба
  # локального файла ↔ публикация ↔ авто-триггеры), и одна зонтичная запись
  # «синхронизация» зачла бы всю подсистему покрытой первым же кейсом.
  # ОБЩЕЕ ДЛЯ ВСЕЙ ГРУППЫ (не повторяется в каждой записи): движок —
  # `data/sync/SyncRepository.kt`, сериализация — `data/sync/LibraryJson.kt`
  # (тот же диалект, что у backup/restore), хранилище удалений — Room-таблица
  # `sync_tombstones` (`data-sync-tombstone-model`). Сеть трогают ровно два
  # метода: `fetchRemote` (`:243-259`) и `createSnippet`/`updateSnippet`
  # (`:262-305`); всё между ними — чистое слияние данных.
  # ГРАНИЦА §8 (называю явно): GitLab здесь — сторонний сервис, как и AO3. В
  # скоупе — контракт НАШЕГО приложения с ним (какие запросы шлём, как читаем
  # ответы и коды ошибок, что делаем с локальными данными); тестирование самого
  # GitLab и нагрузка на него — вне скоупа.
  - id: sync-settings-config-fields
