  # НОВАЯ запись (test-strategist 2026-07-28, инвентарь правил-реакций —
  # воркфлоу роли п.2а; вход: bugs/BUG-015.md + чартер CH-005). До неё правило
  # было невидимо и реестру, и покрытию: 0 записей, 0 кейсов, при том что это
  # ЗАПИСЬ на сторонний сайт от имени пользователя. Все факты сверены чтением
  # BrowserViewModel.kt 2026-07-28, не пересказом бага.
  #  - семантический ТРИГГЕР (как должно по смыслу): ПЕРЕХОД рейтинга работы в
  #    LIKE/SAVE;
  #  - ФАКТИЧЕСКИЕ места вызова (поиском по предикату, ВСЕ, не одно):
  #    :856-861 applyRating (листинг/rating-overlay, в т.ч. «Save note» с
  #    dismiss=false) — кликает при ЛЮБОМ сохранении, и только если найдена
  #    открытая вкладка этой работы (tabs.find { currentWorkId == workId &&
  #    isWorkPage }, :857); :1053-1055 onRateWorkRequested, ветка
  #    pendingPanelSave (панель work-страницы, записи в Room ЕЩЁ НЕТ) — кликает
  #    в tabId той же вкладки; ТРЕТИЙ путь сохранения savePanelRating :743-758
  #    (панель, запись УЖЕ в БД) kudos НЕ кликает вовсе — делает только
  #    авто-скачивание (:756-758);
  #  - ЭФФЕКТ: evalJs("var b=document.getElementById('kudo_submit');if(b)
  #    b.click();") — клик по кнопке kudos на живом archiveofourown.org;
  #  - наблюдаемая ПОВЕРХНОСТЬ: факт клика по узлу #kudo_submit в WebView
  #    вкладки work-страницы (в replay — инструментированный узел фикстуры;
  #    на живом AO3 позитивные пробы ЗАПРЕЩЕНЫ, docs/01 §9);
  #  - КРАСНЫЕ ФЛАГИ (оба сработали ⇒ needs-design + доклад Lead как app_bug —
  #    заведён bugs/BUG-015.md): (а) семантика — переход, код — level-предикат
  #    на каждом событии (edge-vs-level, класс BUG-014); (б) наборы эффектов
  #    разных путей сохранения асимметричны (auto-download есть во всех трёх
  #    путях, kudos — в двух).
  # Гранулярность: ОДНА запись, не две и не три. Асимметрия путей — дефект
  # (BUG-015), а не спецификация: дробить правило на «kudos с листинга» и
  # «kudos с панели» значило бы закрепить дефект как две легитимные фичи.
  # Пересматривать гранулярность — после фикса, когда пути будут либо
  # выровнены, либо разведены по явной причине.
  - id: background-auto-kudos-trigger
    title: "Автоклик кнопки kudos на странице работы AO3, когда рейтинг работы становится Kudosed (LIKE) или Favorite (SAVE)"
    screen: background
    source: "app/src/main/java/com/example/ao3_wrapper/ui/browser/BrowserViewModel.kt"

  # ── Нефункциональные cross-cutting области ────────────────────────────────
  # Решение владельца 2026-07-21 (диспатч test-strategist): пустой `features` НЕ
  # допускается (валидатор check_feature_ids: пусто/отсутствует=ERROR), поэтому
  # нефункциональные cross-cutting области получают СОБСТВЕННЫЕ записи реестра —
  # так инвариант «пусто=ERROR» сохраняется, а coverage_map.py видит область
  # (кейс тегируется nf-записью, а не приблизительной функциональной привязкой,
  # искажавшей покрытие функции: перф-кейс, тегнутый browse-initial-load, ложно
  # зачитывал эту фичу «покрытой»).
  # Эти записи ОПРЕДЕЛЕНЫ ИЗМЕРЕНИЕМ/проверкой, а не дискретной код-фичей: `source`
  # указывает на ПЕРВИЧНЫЙ якорь измеряемой подсистемы (не заявление, что вся
  # «фича» живёт в одном файле — часть свойств cross-cutting по всему процессу).
  # Гранулярность (правило шапки): одна запись = одно наблюдаемо различимое
  # НФ-свойство. cold-start-тайминг / webview-load-тайминг / стабильность
  # (crash/ANR) / память-тренд — разные When/Then, поэтому разные записи, не один
  # зонтик «performance». Область растёт (E2/E4-min остаток docs/01 §9) — новые
  # пробы = новые записи. inventoried_at_commit не тронут: это не переинвентаризация
  # кода (та же сборка 63f6aac), а заведение cross-cutting НФ-записей.

  # E2 performance/stability (docs/01 §5 R-12; область §9 «performance/stability
  # smoke (E2)», designed 2026-07-21). Каждая запись покрыта ровно одним кейсом
  # TC-096..099 (Then кейса = Then записи).
  - id: nf-perf-cold-start-budget
    title: "НФ: холодный старт процесса укладывается в относительный бюджет (am start -W TotalTime/WaitTime)"
    screen: non-functional
