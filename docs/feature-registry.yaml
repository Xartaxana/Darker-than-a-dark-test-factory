  # ── Нефункциональные cross-cutting области ────────────────────────────────
  # Решение владельца 2026-07-21 (диспатч test-strategist): пустой `features` НЕ
  # допускается (валидатор check_feature_ids: пусто/отсутствует=ERROR), поэтому
  # нефункциональные cross-cutting области получают СОБСТВЕННЫЕ записи реестра —
  # так инвариант «пусто=ERROR» сохраняется, а coverage_map.py видит область
  # (кейс тегируется nf-записью, а не приблизительной функциональной привязкой,
  # искажавшей покрытие функции: перф-кейс, тегнутый browse-initial-load, ложно
  # зачитывал эту фичу «покрытой»).
  # Эти записи ОПРЕДЕЛЕНЫ ИЗМЕРЕНИЕМ/проверкой, а не дискретной код-фичей: `source`
  # указывает на ПЕРВИЧНЫЙ якорь измеряемой подсистемы (не заявление, что вся
  # «фича» живёт в одном файле — часть свойств cross-cutting по всему процессу).
  # Гранулярность (правило шапки): одна запись = одно наблюдаемо различимое
  # НФ-свойство. cold-start-тайминг / webview-load-тайминг / стабильность
  # (crash/ANR) / память-тренд — разные When/Then, поэтому разные записи, не один
  # зонтик «performance». Область растёт (E2/E4-min остаток docs/01 §9) — новые
  # пробы = новые записи. inventoried_at_commit не тронут: это не переинвентаризация
  # кода (та же сборка 63f6aac), а заведение cross-cutting НФ-записей.

  # E2 performance/stability (docs/01 §5 R-12; область §9 «performance/stability
  # smoke (E2)», designed 2026-07-21). Каждая запись покрыта ровно одним кейсом
  # TC-096..099 (Then кейса = Then записи).
