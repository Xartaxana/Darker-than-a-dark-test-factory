  # ── Browse/WebView ──────────────────────────────────────────────────────
  # browse-tabs-lifecycle раздроблена test-designer 2026-07-18 (ручной Lead-диспатч
  # «хозяйство-2», docs/09 п.5, дробление зонтиков реестра): title перечислял ПЯТЬ
  # разных Then через «/» (маркер шапки файла) — открыть/закрыть/переключить/лимит,
  # плюс персистентность, которую покрывал один из пяти привязанных кейсов (TC-025)
  # без отдельного слова в title. Нарезка выведена из фактических Then TC-022..026 и
  # сверена с BrowserViewModel.kt/BrowserScreen.kt:
  #   - лимит MAX_TABS: openTab() стр.261-266 (size>=MAX_TABS → showTabLimitWarning,
  #     return false, activeTabIndex не меняется) — TC-022;
  #   - swipe-up закрытие + Undo из snackbar: closeTab()/restoreClosedTab()
  #     стр.307-346 (снапшот tab+history+index, restoreClosedTab вставляет обратно
  #     на исходную позицию) — TC-023;
  #   - эвикция истории Undo: closeTab() стр.328-333 (`while (closedTabSnapshots.size
  #     > 5) remove(min key)`) — ДРУГОЙ Then, чем TC-023 (невосстановимость старого
  #     снапшота, а не успешное восстановление) — TC-024;
  #   - персистентность списка вкладок через рестарт: init{} стр.181-229 (парсинг
  #     TabSnapshot из SharedPreferences) + saveTabsToPrefs() стр.360-376 — Then
  #     «URL/порядок/количество переживают процесс», отдельно от уже существующей
  #     browse-scroll-restore (Then про точность скролла) — TC-025 тегируется В ДОПОЛНЕНИЕ
  #     к browse-scroll-restore, не вместо;
  #   - long-press по ссылке → фоновая вкладка: BrowserScreen.kt
  #     setOnLongClickListener стр.640-648 (`viewModel.openTab(url, background=true)`,
  #     без промежуточного context-меню — прямое действие) — TC-026.
  # Переключение вкладок тапом по чипу (switchTab(), стр.289-295) выделено в
  # ОТДЕЛЬНУЮ запись browse-tab-switch-active test-strategist'ом 2026-07-19
  # (решение по docs/09 Фаза 2 — хвост дробления browse-tabs-lifecycle). Это
  # отдельное наблюдаемо различимое поведение: тап по НЕактивному чипу делает эту
  # вкладку активной, показываемый контент WebView переключается на неё, индикатор
  # активности перемещается (switchTab также сбрасывает _activeScrollY в 0, стр.292).
  # Обработчик тапа: TabStrip.kt clickable(onTap) стр.108 → onSelectTab(index) стр.61
  # → MainActivity.kt:410 browserViewModel.switchTab(it). НЕ покрывается смежной
  # browse-tabstrip-indicators (та — чисто ВИЗУАЛЬНАЯ индикация активного чипа +
  # свайп-close + кнопка New tab, не сам акт переключения) и не покрыто ни одним из
  # 5 кейсов lifecycle как основной Then: TC-022/TC-023 держат активную вкладку лишь
