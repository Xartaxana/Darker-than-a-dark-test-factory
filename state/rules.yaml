# Правила конвейера (аналог sm.json из dmtools). Исполнитель — ВЕРХНИЙ уровень
# /qa-loop (не субагент; docs/03 §1, находка репетиции 2026-07-04): идёт сверху вниз,
# берёт первый подходящий артефакт БЕЗ лока и не в Blocked/wip, ставит лок, диспатчит
# воркера глубины 1 синхронным Task, снимает лок. Порядок = приоритет: сперва разбор
# текущих прогонов и багов, потом новая автоматизация и планирование.
# qa-orchestrator — только read-only планировщик для /qa-loop --dry-run.
# v2 (2026-07-03): pre_steps (событийный контур тёмной фабрики) + правила реакции на
# действия разработчика D1–D12 — спецификация в docs/06-dark-factory.md.
# v3 (2026-07-07): диспетчеризация перенесена на верхний уровень (A1 из docs/09).
version: 3
# Дефолт на проход; числовой аргумент команды (`/qa-loop 6`) переопределяет
# его на один проход, НЕ правя этот файл (SKILL.md qa-loop, 2026-07-16).
# 3 -> 20: слово владельца 2026-08-10 («лимит фабрики можешь поднять до 20,
# чтобы он тебе не мешал») — стоячее значение, действует и на автономные
# heartbeat-проходы.
max_triggered_workflows: 20

# Статусы-паузы: артефакты в них всегда пропускаются (точки вмешательства человека)
skip_statuses: [Blocked]
skip_locks: [wip]

# Порядок выбора артефакта внутри правила: лексикографический по пути файла
# (как обходит rglob/Grep). Зафиксировано 2026-07-07 по вопросу планировщика.

# Шаг 0 каждого прохода — выполняет верхний уровень /qa-loop ДО правил запуском
# скриптов (docs/06 §1). Все 5 шагов реализованы и покрыты тестами (scripts/tests/).
pre_steps:
  - name: stale_locks     # scripts/stale_locks.py: lock старше sla.lock_stale без завершения в логе → снять, залогировать
  - name: sla_sweep       # scripts/sla_sweep.py: просрочки по state/sla.yaml → state/escalations.md + метка attention
  - name: board_inbound   # scripts/board_inbound.py: переходы/комментарии человека на борде → артефакты (docs/06 §3, docs/07)
  - name: gitlab_inbound  # scripts/gitlab_inbound.py: ноты разработчиков из GitLab-issues → ## Обсуждение бага + awaiting: qa (docs/06 §3; вторая inbound-дверь ДО тяжёлой сборки; терминальные статусы — эскалация вместо awaiting)
  - name: build_watch     # scripts/build_watch.py: git fetch app-under-test; новые коммиты → сборка APK → app-under-test.yaml (timeout 600с+)

rules:
  - name: "Новая сборка → smoke, затем regression"
    when: "state/app-under-test.yaml изменился (versionCode/hash != последнего прогона)"
    dispatch: test-runner
    args: { suite: [smoke, regression], mode: replay, regression_selection: impact }
    # D1 (Этап 4 п.5, шаг 2, 2026-07-14): regression — по impact-селекции.
    # test-runner зовёт scripts/impact_select.py (карта state/impact-map.yaml);
    # «FULL REGRESSION» (wide-impact/unknown-файл/недоступный диапазон) → полный
    # набор; иначе — automated_by затронутых областей. smoke всегда полный.
    # Fail-safe: любой сбой селекции = full (протухшая карта не сужает прогон
    # молча). Аудит — поле selection в run-артефакте (schemas/run.schema.yaml).

  - name: "Разобрать падения прогона"
    when: "run.status == NeedsTriage"
    dispatch: failure-analyst
    # Вердикты: APP_BUG | TEST_BUG | SITE_CHANGED | APP_CHANGED | ENV_ISSUE | FLAKY
    # APP_CHANGED (docs/06 D9): поведение изменено коммитом приложения без тикета —
    # analyst сверяется с git log app-under-test между сборками.

  - name: "Завести баг по APP_BUG"
    when: "run содержит вердикт APP_BUG без linked_bug"
    dispatch: bug-reporter

  - name: "Ответить на вопрос разработчика в баге"   # docs/06 D6
    when: "bug имеет реплику с awaiting: qa в ## Обсуждение"
    dispatch: bug-reporter
    args: { role: responder }

  - name: "Починить тест по TEST_BUG/SITE_CHANGED/APP_CHANGED"
    when: "падение с вердиктом TEST_BUG, SITE_CHANGED или APP_CHANGED без resolution"
    dispatch: test-maintainer

  - name: "Верифицировать исправленный баг"          # docs/06 D1
    when: "bug.status == Fixed И (есть сборка новее bug.found_in ИЛИ bug.type == test_debt —
      долг фреймворка не ждёт сборку приложения, B4)"
    dispatch: fix-verifier
    # «Сборка новее found_in» (уточнение батча dual-mode 2026-08-10, B6):
    # коммит found_in — ПРЕДОК source_commit кандидата (git merge-base
    # --is-ancestor, направление обязательно) И built_at новее; сравнение
    # по versionCode НЕвалидно (dev-local(12) у всех локальных сборок,
    # dev-<IID> у CI — немонотонно между источниками). Несравнимые линии
    # (force-push) — считается новее с явной пометкой в таблице верификации.
    # bug.verify_build_ref (канал ноты разработчика «билд для проверки»,
    # docs/06 §3а): непустой ref формата pipeline:<iid>|job:<id> —
    # верификация НА УКАЗАННОМ билде (адресная установка, глобальный
    # app-under-test.yaml не трогается); consumed:/stale: маркеры — no-op
    # (потреблён / артефакт протух, см. промпт fix-verifier).

  - name: "Перепроверить отклонённый баг"            # docs/06 D4
    when: "bug.status == Rejected И нет строки верификации на актуальной сборке"
    dispatch: fix-verifier
    args: { mode: recheck-rejected }
    # Воспроизвёлся → доказательства в ## Обсуждение, awaiting: dev, dispute_count+1
    # (при достижении sla.reopened_pingpong — Blocked + эскалация).
    # Не воспроизвёлся → принять Rejected; ложноположительный тест → test-maintainer.

  - name: "Согласовать тесты с задуманным поведением"  # docs/06 D5
    when: "bug.status == Intended И связанные TC/тесты не обновлены"
    dispatch: test-maintainer

  - name: "Перепроверить репро старых багов на новой сборке"  # docs/06 D3
    when: "после smoke/regression на новой сборке есть Open/Reopened blocker|critical с
      last_seen_in < текущей сборки, ИЛИ known_issue: true любой severity (D14, B2 —
      «не ухудшился» проверяем на каждой сборке независимо от severity)"
    dispatch: fix-verifier
    args: { mode: still-repro }
    # D14-Intended (ESC-029, Lead 2026-08-12): ветка known_issue:true ловит и
    # status Intended — это ЕДИНСТВЕННЫЙ механизм, перепрогоняющий регресс-замок
    # принятого поведения на новых сборках (P3-кейсы отсечены фильтром штатного
    # регресса). known_issue у Intended держится "true" навсегда; сброс ловит
    # WARN validate_frontmatter (preflight). Полный текст — docs/06 D14-Intended.

  - name: "Починить автотест в карантине/на обслуживании"   # B3, приоритет ВЫШЕ новой автоматизации
    when: "test-case.automation_status == quarantined|needs_maintenance"
    dispatch: test-maintainer
    # Выход quarantined→active только через 3 зелёных прогона подряд (матрица
    # transitions.yaml, машина automation). Просроченный карантин ловит sla_sweep
    # (quarantine_expired) — правило не даёт долгу копиться молча.

  - name: "Устранить test debt"                             # B4
    when: "bug.type == test_debt И status == Open|Reopened"
    dispatch: test-maintainer
    # test-maintainer чинит долг фреймворка (flaky/slow/фикстуры/локаторы) и переводит
    # Open→Fixed сам (guard-переход в матрице); верификация — общим правилом D1.

  - name: "Доработать автотест по ревью"                    # F1, выше нового ревью и новой автоматизации
    when: "test-case.review == changes_requested"
    dispatch: test-automator
    # Автор отрабатывает замечания из раздела «## Ревью автотеста», удаляет review →
    # кейс возвращается на повторное ревью следующим правилом.

  - name: "Ревью нового автотеста"                          # F1
    when: "test-case.status == Approved И automated_by заполнен И нет review
      И (red_lock пуст ИЛИ баг из red_lock уже НЕ в Open|Reopened)"
    dispatch: test-reviewer
    # Гейт: Approved→Automated переводит ТОЛЬКО test-reviewer (матрица transitions.yaml).
    # Он же ставит automation_status: active (B3).
    # red_lock-guard (Lead 2026-08-03, прецедент TC-139/BUG-015): кейс с
    # намеренно-красным тестом до фикса бага (поле red_lock, schemas/
    # test-case.schema.yaml) в F1 не проходит ПО ПОСТРОЕНИЮ — независимое
    # воспроизведение ЗЕЛЁНОГО прогона невозможно, диспатч был бы холостым
    # (до 2026-08-03 правило матчило TC-139 каждый проход). Баг замка дошёл
    # до Fixed/Verified → guard отпускает, кейс уходит в F1 штатно (замок
    # стал зелёным регресс-тестом). Ссылочную целостность red_lock держит
    # validate_frontmatter (preflight). Детектор утечки guard'а — реактивный
    # no-op test-reviewer («тест ожидаемо красный») в orchestrator-log +
    # разбор no-op'ов чеком калибровки.

  - name: "Автоматизировать Approved-кейс"
    when: "test-case.status == Approved И пусто automated_by И кейс НЕ покрыт
      Open|Reopened test_debt-багом (bugs/*.md: test_cases содержит его TC-id)"
    dispatch: test-automator
    # Guard на входе (2026-07-09, класс AT-BUG-004/005/006 — блокер жил прозой
    # в «Заметках для автоматизации», конвейер его не видел): перед диспатчем
    # верхний уровень (а) сверяет кейс с Open|Reopened test_debt-багами по
    # test_cases (механически, Grep по bugs/); (б) грепает «Заметки для
    # автоматизации» кейса на маркеры блокера («не поддержан»,
    # «не автоматизируется штатно», «эскалировать как техническую задачу»,
    # «нет записи», «нет фикстуры»). Маркер есть, покрывающего бага нет →
    # НЕ диспатчить вслепую: завести test_debt-баг (+ defect_found в
    # routing-журнал), кейс возьмётся после устранения долга (B4).
    # Проверка (б) — детектор отказа обязанности test-designer заводить
    # test_debt у источника (промпт test-designer, шаг 4 воркфлоу).
    # Внешний детектор самого guard'а: реактивный путь триажа (холостой
    # диспатч вскрывается падением) + чек еженедельной калибровки (OS-репо).

  - name: "Красная проба существующего автотеста (ретрофит red_probe)"
    when: "test-case.status == Automated И automation_status == active И red_probe пуст"
    dispatch: test-reviewer
    # Режим red-probe-only (раздел «## Режим red-probe-only (ретрофит)» промпта
    # агента) — ТОЛЬКО пп.6-7 чек-листа F1, без полного ревью и без смены статуса
    # кейса. Введено 2026-07-17 (ярус 1 docs/09 п.10, механизм-ретрофит взамен
    # прежней прозы «в очередь батчами»). Приоритет НИЖЕ карантина/test debt/F1/
    # новой автоматизации — ретрофит долга по красной пробе не должен вытеснять
    # более срочные правила очереди. Батч-темп задаёт max_triggered_workflows
    # прохода (как у остальных правил).

  - name: "Спроектировать кейсы для области без покрытия"
    when: "в §9 docs/01-test-strategy.md есть ПУНКТ списка областей, помеченный меткой needs-design"
    dispatch: test-designer
    # Метка — только у пунктов P0/P1-списков §9 (конвенция в начале §9).
    # Упоминания подстроки needs-design вне пунктов (заголовок §9, текст
    # конвенции, исторические комментарии §10) — НЕ триггер.
    # Конвенция формы (2026-07-28, класс «токен в отрицании»): ВНУТРИ пункта
    # §9 буквальный токен needs-design = ТОЛЬКО действующая метка; отрицания/
    # история пишутся описательно без токена (блок «Форма токена в пунктах»
    # §9). Токен в отрицании внутри пункта — дефект документа, не триггер:
    # чинить пункт (переписать описательно), не диспатчить.
    # test-designer, закрыв область, снимает метку в том же ходе; если
    # диспатчнут на уже покрытую область — снимает метку и возвращает no-op
    # (это же — детектор утечки конвенции: no-op в orchestrator-log, разбор
    # no-op'ов — чек калибровки).

  - name: "Обновить стратегию при изменении приложения"
    when: "app-under-test/PROJECT.md изменился с последнего анализа ИЛИ появился вердикт APP_CHANGED
      ИЛИ (docs/feature-registry.yaml существует И его inventoried_at_commit не совпадает
      с commit сборки в state/app-under-test.yaml)"
    dispatch: test-strategist
    # Третья ветка (часть 5 спеки трассабилити, 2026-07-17): build_watch уже
    # ловит новые коммиты app-under-test и обновляет app-under-test.yaml;
    # расхождение commit'а сборки с inventoried_at_commit реестра фич =
    # реестр протух → test-strategist переинвентаризирует реестр ПО КОДУ
    # и протаскивает дельту в риски/needs-design. Дублирующий индикатор
    # протухания — строка-предупреждение в шапке state/coverage-map.md
    # (генерируется шагом снимка). Guard «существует» — до приземления
    # диспатча 1 (создание реестра) ветка заведомо no-op.

  - name: "Ревью плана Proposed-чартера (гейт критик-на-план)"   # Этап 4 п.11 шаг 2, автозаведение 2026-07-21
    when: "charter.status == Proposed И plan_review пуст"
    dispatch: critic
    args: { mode: charter-plan-review }
    # Критик-на-план (CLAUDE.md пр.3): чартер = спека сессии 90-120 мин.
    # Диспатч прилагает критику сам чартер + PERTURBATIONS.md + coverage-map;
    # критерии вердикта: анти-дубль (не повторяет scripted/прошлые чартеры),
    # реализуемость сценариев инструментом, ловушки перенесены. Вердикт
    # PASS → координатор прохода ТЕМ ЖЕ проходом переводит Proposed→Planned
    # (переход by qa-loop в transitions.yaml) и пишет
    # plan_review: "critic:PASS:<ISO ts>". FAIL → Blocked + эскалация
    # (разбирает Lead). Приёмка Opus-вердикта Sonnet-координатором — с
    # basis=queued-to-lead (ИСПРАВЛЕНО калибровкой №4 2026-07-28: прежняя
    # строка предписывала basis=critic, но critic-вход не легализует
    # opus-класс — критик не ревьюит равного себе; код-гейт log_append.py
    # теперь режет это парой (tier(agent), tier(by))); ратификация полного
    # Lead — на границе сессии (быстрый вариант гейта, слово оператора
    # 2026-07-21).

  - name: "Завести следующий exploratory-чартер"   # автозаведение, слово оператора 2026-07-21; каденция пересмотрена оператором 2026-07-30
    when: "нет CH-*.md в статусе Proposed|Planned|InProgress И (текущий проход
      — первый после ЯВНОГО вызова /qa-loop оператором (не wakeup/heartbeat-
      продолжение; различает координатор по контексту своего вызова) ИЛИ
      новейший Done.executed_at старше 24 часов (суточная каденция при
      долгой автономной работе) ИЛИ после новейшего Done появился вердикт
      APP_CHANGED ИЛИ появилось >=2 новых Open|Reopened app_bug одной
      зоны/фичи)"
    dispatch: charter-designer
    args: { cadence_hours: 24 }
    # spec-factory-window v6 (2026-08-16), К5з: внутри окна /factory
    # «первый проход после ЯВНОГО вызова» — теперь МЕХАНИЧЕСКИЙ ключ:
    # `passes_done == 0` у СВОЕГО nonce в state/factory-mode.json (скилл
    # factory пишет свежий mode-файл на явный /factory N; wakeup-продолжения
    # прохода — НЕ явный вызов, passes_done там уже > 0). Существующий
    # фолбэк «различает координатор по контексту своего вызова» (строка
    # when выше) СОХРАНЯЕТСЯ без изменений — для ручных /qa-loop ВНЕ окна
    # (у них нет nonce/mode-файла, ключ не применим, правило не должно
    # терять вход).
    # ПАУЗА 2026-08-03..2026-08-09 — СНЯТА СЛОВОМ ВЛАДЕЛЬЦА 2026-08-09
    # (разбор ESC-022: скоуп паузы был «окно репетиции без CH-009», окно
    # закрыто разбором 2026-08-09; слово владельца: «снимаем паузу»).
    # Правило действует в штатной редакции «Exploratory всегда» ниже;
    # ESC-022 в state/escalations.md помечена resolved. Полный текст
    # паузы (введение 08-03, перенос носителя 08-04, переспрос) — git
    # до этого коммита.
    # «Exploratory всегда» (редакция 2026-07-30, слово оператора): каждый
    # РУЧНОЙ старт фабрики получает свежий чартер, если очередь пуста;
    # автономный цикл — не реже раза в сутки. Guard «нет CH в P|P|I»
    # сохраняет глубину очереди 1 — на старте с непустой очередью проход
    # чартер не заводит, а гейтит/исполняет имеющийся. Ошибка координатора
    # в сторону НЕзаведения — ловится sla-детектором charter_queue_empty
    # (48ч, state/sla.yaml); в сторону лишнего заведения — критик-гейтом
    # плана (анти-дубль) и самим guard'ом. Событийные ветки (APP_CHANGED,
    # кластер багов) заводят вне каденции — зону передай в диспатч. Деривация «зоны» бага
    # (вердикт critic N2, 2026-07-21): у bug-frontmatter поля зоны НЕТ —
    # зона выводится из area связанных test_cases (путь test-cases/<area>/),
    # при их отсутствии — из прозы бага; отсутствующий type = app_bug
    # (конвенция bug.schema.yaml). Ветка APP_CHANGED: сравнивай ts вердикта
    # (в run-артефакте) с Done.executed_at новейшего чартера. Обе событийные
    # ветки — ускорители поверх вычислимой каденс-ветки: ложный лишний
    # Proposed ловит критик-гейт, пропуск — каденция + failsafe 96ч.
    # Генератор пишет ТОЛЬКО Proposed (гейт выше) + обновляет
    # PERTURBATIONS.md. Источники миссии и анти-дубль — промпт
    # .claude/agents/charter-designer.md. Детекторы отказа: заведение —
    # sla_sweep чек charter_queue_empty (порог 96ч > каденции —
    # срабатывает позже штатного заведения); гейт — чек 2 session-handoff
    # (Planned без критик-вердикта в журнале = FAIL хендоффа) + деградация
    # генератора (K чартеров подряд без находок) — чек калибровки.
    # Прямое заведение Lead/человеком (сразу Planned) остаётся легальным —
    # initial-статусы машины charter.

  - name: "Исполнить exploratory charter"     # P7 docs/10, Этап 4 п.11 шаг 2 (2026-07-14)
