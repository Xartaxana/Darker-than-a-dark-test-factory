# Схема frontmatter бага (G3, docs/09). Поля матрицы D1–D12 (докс/06 §2) опциональны —
# вставляются агентами/board_inbound по мере переходов.
#
# Конвенция ID (решение оператора 2026-07-08): `BUG-xxx` — баг ПРИЛОЖЕНИЯ
# (type: app_bug или поле type отсутствует — уходит внешней команде разработки);
# `AT-BUG-xxx` — баг/долг ТЕСТОВОЙ СИСТЕМЫ (type: test_debt, чинит сама фабрика).
# Нумерация сквозная для обоих префиксов (общий счётчик, не два раздельных).
# Кросс-чек префикс<->type — scripts/validate_frontmatter.py (check_cross_field).
type: bug
id_pattern: "^(AT-)?BUG-\\d{3,}$"
required: [id, title, severity, status, updated]
fields:
  severity: { enum: [blocker, critical, major, minor] }
  status:   { enum: [Open, Reopened, Fixed, Verified, Rejected, Intended, Blocked] }
  updated:  { pattern: "^\\d{4}-\\d{2}-\\d{2}[T ][\\d:.+]+Z?$" }
  status_since: { pattern: "^\\d{4}-\\d{2}-\\d{2}[T ][\\d:.+]+Z?$" }
  lock:     { pattern: "^$|^wip$|^[A-Za-z0-9_-]+:\\d{4}-\\d{2}-\\d{2}T[\\d:.]+Z?$" }
  awaiting: { enum: [dev, qa, none] }
  reopen_count:  { pattern: "^\\d+$" }
  dispute_count: { pattern: "^\\d+$" }
  regression_of: { pattern: "^(AT-)?BUG-\\d{3,}$" }
  last_seen_in: {}
  found_in: {}
  fixed_in: {}
  test_cases: {}
  runs: {}
  duplicates: {}
  # B1 (docs/09 Этап 2, docs/06 D13): реальный баг, риск принят / не чинится в этом
  # релизе — НЕ Rejected (это баг) и НЕ Intended (это не задумано). Обязателен
  # resolution_comment (кросс-проверка validate_frontmatter.py); не блокирует TC/gate.
  resolution: { enum: [accepted_risk, wontfix] }
  resolution_comment: {}
  # B2 (docs/06 D14): подтверждённый баг, релиз идёт с ним — в digest, дедуп APP_BUG
  # сверяется с ним в первую очередь, still-repro (D3) проверяет вне зависимости от severity.
  known_issue: { enum: ["true", "false"] }
  # B5: причина простоя в Blocked → SLA/digest. Обязателен по смыслу при status: Blocked
  # (validate_frontmatter.py — WARN, не ERROR: человек с борды может не успеть заполнить
  # сразу); фактори-переходы (D8 pingpong, конфликт board-inbound) проставляют сами.
  blocked_reason: { enum: [environment, missing_fixture, product_decision, dev_answer, permissions] }
  # B4 (docs/09 Этап 2): долг ТЕСТОВОЙ СИСТЕМЫ живёт в bugs/ с type: test_debt
  # (отсутствие поля = app_bug — обратная совместимость всех существующих багов).
  # Отличия от app_bug: чинит фабрика (test-maintainer/test-automator, guard в
  # transitions.yaml), Fixed не ждёт сборку приложения, SLA bug_open_* не шумит
  # (виден в отдельной секции digest). debt_kind — категория из ревью docs/08 B4.
  type: { enum: [app_bug, test_debt] }
  debt_kind: { enum: [flaky_test, slow_test, missing_fixture, weak_locator,
                      obsolete_test_case, missing_evidence, broken_environment] }
  # N3 (docs/tasks/2026-08-01_gitlab-bugs-publish.md): iid GitLab Issue,
  # writeback после первого sync (scripts/gitlab_sync.py). Только BUG-*
  # (app_bug) публикуются в GitLab; поле не имеет смысла у AT-BUG-*.
  gitlab_issue: { pattern: "^\\d+$" }
  # Батч мелочей (репетиция тёмного дня 2026-08-04, разбор 2026-08-09):
  # сеяный артефакт репетиции/учений — вымышленный баг, заведённый намеренно
  # для проверки конвейера. Единственный потребитель поля —
  # scripts/gitlab_sync.py: в GitLab не публикуется (пропуск в полном sync,
  # --dry-run и --check — отдельной строкой «skipped (seeded)»; точечный
  # --bug — явный отказ). SLA/дайджест поле НЕ читают и читать НЕ ДОЛЖНЫ:
  # сеяные подкладки обязаны шуметь в SLA в окне учений (свидетельства
  # П16/E5 репетиции) — реальный простой глушится resolution'ом на
  # закрытии, как у обычного бага. "true" = сеяный; "false"/отсутствие
  # поля = не сеяный (обе формы валидны, чтобы копирование конвенции
  # known_issue не ломало pre_step — некрит-1 критик-входа 2026-08-09).
  seeded: { enum: ["true", "false"] }
  # A3(б) (spec-build-source-dual-mode v4): адресный канал provided —
  # разработчик указывает в ноте GitLab-issue билд, на котором тестить фикс.
  # gitlab_inbound.py извлекает ЧИСЛО из URL пайплайна/джоба СВОЕГО repo
  # (никогда сырой URL/чужой repo) и пишет поле idемпотентно. Жизненный
  # цикл consumed:/stale: — fix-verifier.md (C10/E2), не gitlab_inbound.py.
  # Критик-вход (мелочь 4): [0-9], не \d — \d матчит любой Unicode Nd, не
  # только ASCII-цифры.
  verify_build_ref: { pattern: "^$|^pipeline:[0-9]+$|^job:[0-9]+$|^consumed:.+$|^stale:.+$" }
