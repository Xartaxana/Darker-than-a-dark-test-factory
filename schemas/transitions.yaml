# Матрица переходов статусных машин (C3, docs/09 Этап 2) — ЕДИНЫЙ источник правды.
# Свод docs/03 §2 (статусные машины) + docs/06 §2 (матрица D1–D12) + §3 (борда).
#
# Кто ей подчиняется:
# - board_inbound.py строит из неё whitelist переходов с борды (via_board: true);
# - sla_sweep.py применяет только легальные factory-переходы (pingpong → Blocked);
# - self-tests (scripts/tests/test_transitions.py) сверяют enum'ы schemas/*.schema.yaml,
#   паритет board-whitelist и side effects скриптов с матрицей;
# - агенты перед сменой status обязаны найти свой переход здесь; нет перехода —
#   это эскалация, а не «переход по смыслу».
# Менять ТОЛЬКО вместе с тестами: правка матрицы без зелёного test_transitions —
# нарушение контракта.
#
# Поля перехода:
#   from/to    — статусы ("*" = из любого)
#   by         — акторы: human | factory (любой агент/скрипт) | конкретное имя
#   via_board  — true: человек может сделать переход карточкой на борде
#                (без флага человек правит только frontmatter напрямую)
#   effects    — обязательные побочные эффекты СВЕРХ always_effects
#   guard      — {поле: значение} frontmatter: переход существует ТОЛЬКО для
#                артефактов с этим значением (B4: ветки test_debt в машине bug)
#   ref        — пункт спецификации (docs/06 D1–D12) или прецедент
version: 2

actors:
  groups:
    # exploratory-tester и charter-designer добавлены вместе с машиной charter
    # (E5, автозаведение exploratory-чартеров) — exploratory-tester уже был
    # актором переходов test-case/bug (Follow-up) и машины charter, но
    # отсутствовал в самой группе factory: существующий пробел, закрыт заодно.
    factory: [qa-loop, test-runner, failure-analyst, bug-reporter, fix-verifier,
              test-automator, test-designer, test-maintainer, test-strategist,
              test-reviewer, sla_sweep, board_inbound, stale_locks, build_watch,
              exploratory-tester, charter-designer, gitlab_inbound]
    # lead — Lead-сессия (координатор яруса Lead-привязки —
    # delegation.config.yaml roles.lead, после D-0099 Opus; либо выше,
    # Fable-резерв) как актор переходов
    # вне групп human/factory: добавлен 2026-07-29 вместе с переходом
    # отката Verified->Fixed (актор был использован в переходе, но не
    # зарегистрирован — поймано юнитом test_matrix_is_valid при прогоне
    # батча misc-batch-lead-queue-0729: живой (в)-детектор сработал).
    lead: [lead]

# Эффекты ЛЮБОГО перехода: оба поля обновляются меткой момента перехода.
always_effects: [status_since, updated]

machines:
  bug:
    initial: [Open]            # app_bug создаёт bug-reporter (docs/03 §1);
                               # test_debt (B4) — failure-analyst/test-maintainer
    terminal: [Verified]       # выход — ручное переоткрытие человеком либо
                               # откатный переход с явной меткой rollback: true
                               # (исключение инварианта терминальности, 07-29)
    statuses: [Open, Reopened, Fixed, Verified, Rejected, Intended, Blocked]
    transitions:
      # --- действия человека (разработчика) ---
      - {from: Open,     to: Fixed,    by: [human], via_board: true, via_gitlab: true,
         ref: "D1/D2: пофиксил (второй канал — GitLab label-событие
           qa-status::QAready, gitlab_inbound.py проводник; актор — тот же
           человек-разработчик, E3 spec-build-source-dual-mode v4: флаг
           МЕНЯЕТ машинную матрицу, не только аннотация)"}
      - {from: Open,     to: Rejected, by: [human], via_board: true, ref: "D4: не баг / не воспроизводится"}
      - {from: Open,     to: Intended, by: [human], via_board: true, ref: "D5: так задумано"}
      - {from: Reopened, to: Fixed,    by: [human], via_board: true, via_gitlab: true,
         ref: "D1: пофиксил после реопена (критик B3, 2026-08-10: второй
           канал флипает ОБА перехода Open->Fixed и Reopened->Fixed —
           матрица обязана описывать оба)"}
      - {from: Reopened, to: Rejected, by: [human], via_board: true, ref: "D4"}
      - {from: Reopened, to: Intended, by: [human], via_board: true, ref: "D5"}
      - {from: "*",      to: Open,     by: [human], via_board: true, ref: "ручное переоткрытие из любого статуса"}
      # --- вердикты фабрики ---
      - {from: Fixed,    to: Verified, by: [fix-verifier],
         ref: "D1: связанные TC зелёные на сборке новее found_in; только fix-verifier, человек НЕ закрывает баги мимо верификации"}
      - {from: Fixed,    to: Reopened, by: [fix-verifier], effects: [reopen_count+1],
         ref: "D1: репро жив на новой сборке"}
      - {from: Verified, to: Fixed, by: [qa-loop, lead], rollback: true,
         ref: "откат ошибочной верификации по критик-вердикту на приёмке D1
           (прецедент AT-BUG-031 2026-07-29: Verified поставлен по device-free
           smoke, не исполнявшему тело функции; координатор откатил до
           повторной верификации). НЕ reopen (reopen_count не растёт): дефект
           ПРОЦЕДУРЫ верификации, не репро бага; причина отката — реплика в
           Обсуждении с ссылкой на критик-вердикт. rollback: true — явная
           метка исключения из инварианта терминальности (валидатор пускает
           не-human выход из terminal только с ней)"}
      # --- эскалации (эффект escalation = строка в state/escalations.md) ---
      - {from: Open,     to: Blocked, by: [human, factory], via_board: true, effects: [escalation],
         ref: "D6: продуктовый вопрос / конфликт борды / решение человека"}
      - {from: Reopened, to: Blocked, by: [human, factory], via_board: true, effects: [escalation],
         ref: "D8: пинг-понг reopen_count ≥ sla.reopened_pingpong"}
      - {from: Rejected, to: Blocked, by: [factory], effects: [escalation],
         ref: "D4: спор по Rejected, dispute_count ≥ sla.reopened_pingpong"}
      # --- ветки test_debt (B4): долг тестовой системы чинит сама фабрика ---
      # Для app_bug (guard'а нет/type=app_bug) Fixed по-прежнему ставит ТОЛЬКО человек.
      # Верификация — общая: Fixed→Verified делает fix-verifier (прогон связанных TC),
      # для test_debt новая сборка приложения НЕ нужна (фикс в фреймворке).
      - {from: Open,     to: Fixed, by: [test-maintainer, test-automator],
         guard: {type: test_debt},
         ref: "B4: долг устранён (тест починен/фикстура записана), ждёт верификации"}
      - {from: Reopened, to: Fixed, by: [test-maintainer, test-automator],
         guard: {type: test_debt},
         ref: "B4: повторная починка долга после Reopened"}

  test-case:
    initial: [Draft, Review]   # test-designer: Draft при спорных требованиях, иначе сразу Review
    terminal: []
    statuses: [Draft, Review, Approved, Automated, Blocked]
    transitions:
      - {from: Draft,    to: Approved, by: [human], via_board: true, ref: "D12: аппрув (в т.ч. с борды)"}
      - {from: Review,   to: Approved, by: [human], via_board: true, ref: "D12"}
      - {from: Review,   to: Approved, by: [qa-loop],
         ref: "авто-approve допущен ТОЛЬКО для P2/P3 (docs/03 §2); пока не реализован"}
      - {from: Draft,    to: Review,   by: [test-designer],
         ref: "кейс дозрел: спорный вопрос снят"}
      # F1: гейт ревью. test-automator ЗАПОЛНЯЕТ automated_by (3 зелёных + allure.id),
      # но статус не меняет; в Automated переводит ТОЛЬКО test-reviewer после чек-листа
      # (архитектура/evidence/фикстуры/flake-риск/traceability) — «вторые глаза»,
      # автор не принимает собственную работу.
      - {from: Approved, to: Automated, by: [test-reviewer], effects: [automated_by_required],
         ref: "F1: ревью пройдено; заодно ревьюер ставит automation_status: active (B3)"}
      - {from: "*",      to: Review, by: [human, test-automator, test-maintainer], via_board: true,
         ref: "вернуть на доработку (прецедент TC-009: replay-блокер)"}
      - {from: "*",      to: Blocked, by: [factory], effects: [escalation],
         ref: "деградация/конфликт (прецедент TC-013..015)"}

  run:
    initial: [NeedsTriage, Closed]   # test-runner: есть падения / все зелёные
    terminal: [Closed]
    statuses: [NeedsTriage, Triaged, Closed, Blocked]
    transitions:                     # переходов с борды для run НЕТ (только комментарии)
      - {from: NeedsTriage, to: Triaged, by: [failure-analyst],
         ref: "каждое падение получило вердикт из реестра"}
      - {from: Triaged, to: Closed, by: [bug-reporter, test-maintainer, qa-loop],
         ref: "все вердикты обработаны: баг заведён / тест починен / карантин"}
      - {from: "*", to: Blocked, by: [factory], effects: [escalation],
         ref: "деградация (прецедент RUN-REH-901: нечего гонять — не выдумывать вердикт)"}
      - {from: Blocked, to: NeedsTriage, by: [human], ref: "человек разобрал причину блока"}

  # B3 (docs/09 Этап 2): lifecycle АВТОТЕСТА — вторая машина на артефакте test-case,
  # поле frontmatter `automation_status` (НЕ `status`). Живёт только у Automated-кейсов:
  # test-automator ставит active при переводе Approved→Automated. Карантин не бывает
  # бесконечным: quarantined обязан нести quarantine_reason/since (+опц. expiry),
  # надзор — sla_sweep, правило quarantine_expired. Переходов с борды нет: судьбой
  # автотеста управляет фабрика, человек решает только deprecated (кейс устарел).
  automation:
    field: automation_status
    initial: [active]          # ставит test-reviewer вместе с status: Automated (F1)
    terminal: [retired]
    statuses: [active, quarantined, needs_maintenance, deprecated, retired]
    transitions:
      - {from: active, to: quarantined, by: [failure-analyst, test-maintainer],
         effects: [quarantine_fields],
         ref: "вердикт FLAKY: тест нестабилен, исключить из сигнала до починки; заводится test_debt (B4)"}
      - {from: active, to: needs_maintenance, by: [failure-analyst, test-maintainer, test-reviewer],
         ref: "вердикт TEST_BUG/SITE_CHANGED/APP_CHANGED: тест сломан детерминированно;
               test-reviewer — исход красной пробы 'тест не умеет падать' (режим
               red-probe-only, docs/06; добавлен 2026-07-17 по блокеру critic)"}
      - {from: quarantined, to: active, by: [test-maintainer], effects: [quarantine_cleared],
         ref: "починен: 3 зелёных прогона подряд (критерий как у test-automator)"}
      - {from: quarantined, to: needs_maintenance, by: [test-maintainer],
         ref: "разобрался: это не flake, а детерминированная поломка"}
      - {from: needs_maintenance, to: active, by: [test-maintainer],
         ref: "починен: 3 зелёных прогона подряд"}
      - {from: "*", to: deprecated, by: [human, test-strategist],
         ref: "кейс/область устарели — решение человека или стратегии, не воркера"}
      - {from: deprecated, to: retired, by: [human, test-maintainer],
         ref: "код теста удалён из suite, allure.id снят; терминал"}

  # E5 (автозаведение exploratory-чартеров): вторая точка входа в машину
  # charter'а — charter-designer (Opus) заводит чартер в Proposed (авто,
  # каденция — правило rules.yaml, не эта матрица); прежний прямой путь
  # человека/Lead сразу в Planned остаётся легальным (initial несёт оба
  # статуса). Гейт Proposed→Planned — критик-на-план (CLAUDE.md пр.3):
  # переход легален только когда frontmatter-поле plan_review заполнено
  # PASS-вердиктом, зафиксированным в routing-журнале; сама проверка
  # заполненности — не дело матрицы (она про актора/эффект), это делает
  # координатор qa-loop/человек перед переходом.
  charter:
    initial: [Proposed, Planned]  # Proposed — charter-designer (авто); Planned — прежний прямой путь
    terminal: [Done]
    statuses: [Proposed, Planned, InProgress, Done, Blocked]
    transitions:
      - {from: Proposed, to: Planned, by: [human, qa-loop], effects: [plan_review_required],
         ref: "гейт критик-на-план (CLAUDE.md пр.3): только при заполненном plan_review — вердикт PASS критик-входа, зафиксированный в routing-журнале"}
      - {from: Planned, to: InProgress, by: [exploratory-tester],
         ref: "лок взят, сессия идёт"}
      - {from: InProgress, to: Done, by: [exploratory-tester],
         ref: "протокол и follow-up заполнены"}
      - {from: "*", to: Blocked, by: [factory], effects: [escalation],
         ref: "критик FAIL по плану / деградация сессии"}
      - {from: Blocked, to: Planned, by: [human, lead],
         ref: "человек/Lead разобрал причину блока; актор lead добавлен 2026-07-31
           (разбор ESC-010/012): ref с самого начала называл Lead, но списка by
           он не достигал — Lead-разбор Blocked-чартера упирался в переход,
           который сам же ref ему предписывает. Полный Lead (ярус
           Lead-привязки delegation.config.yaml или выше) только;
           деградированный координатор Blocked не снимает (CLAUDE.md,
           'Деградация Lead' п.2)"}
