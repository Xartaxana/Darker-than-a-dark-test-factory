# Схема frontmatter отчёта о прогоне (G3, docs/09).
type: run
id_pattern: "^RUN-[A-Za-z0-9-]+$"
required: [id, suite, status]
fields:
  suite:  { enum: [smoke, regression, canary, verification] }
  mode:   { enum: [live, replay] }
  status: { enum: [NeedsTriage, Triaged, Closed, Blocked] }
  updated: { pattern: "^\\d{4}-\\d{2}-\\d{2}[T ][\\d:.+]+Z?$" }
  status_since: { pattern: "^\\d{4}-\\d{2}-\\d{2}[T ][\\d:.+]+Z?$" }
  lock:   { pattern: "^$|^wip$|^[A-Za-z0-9_-]+:\\d{4}-\\d{2}-\\d{2}T[\\d:.]+Z?$" }
  app_version: {}
  totals: {}     # {passed, failed, skipped} из шаблона run-report
  allure: {}     # путь к allure-results прогона
  # Пер-TC результаты (Этап 4 п.12, находка r10-coverage-map): {TC-xxx: passed|
  # failed|skipped|quarantined}, заполняет test-runner из allure-results
  # (@allure.id теста == id кейса). Опционален для прогонов до 2026-07-14;
  # отсутствие в НОВОМ прогоне ловит coverage_map (явная строка деградации).
  tc_results: {}
  # D1 (Этап 4 п.5, шаг 2): режим отбора regression — full | impact,
  # + диапазон коммитов селекции; пишет test-runner. Аудит селекции — по run.
  selection: {}
  # B5 (docs/09 Этап 2): причина простоя в Blocked; см. schemas/bug.schema.yaml.
  blocked_reason: { enum: [environment, missing_fixture, product_decision, dev_answer, permissions] }
  # AT-BUG-026 B3-(б): счётчик device-liveness guard'а "N/M" из терминальной
  # строки pytest «recoveries this session = N/M» (framework/tests/conftest.py::
  # pytest_terminal_summary; при N>0 строка вывода несёт токен ENV_ISSUE —
  # schemas/evidence.yaml, вход failure-analyst). Заполняет test-runner (шаг 3
  # промпта). Опционален для прогонов до 2026-07-28 и для Blocked-прогонов,
  # где pytest не стартовал (строки в выводе нет — причина словами в отчёте);
  # отсутствие в НОВОМ прогоне ловит coverage_map (строка деградации,
  # симметрично tc_results).
  recoveries: { pattern: "^\\d+/\\d+$" }
  # M-C.1 (spec-build-source-dual-mode v4): source_commit сборки, на которой
  # прогнан ЭТОТ run — первичный идентификатор для машинной предковости
  # baseline (git merge-base --is-ancestor found_in..source_commit), не
  # versionCode (неразличим между local-сборками, немонотонен при смене
  # источника — B6). Пишет test-runner. Опционален для прогонов до
  # 2026-08-10 (легаси-развязка C7 — см. test-runner.md/failure-analyst.md).
  source_commit: {}
