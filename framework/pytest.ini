[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --alluredir=allure-results
    --clean-alluredir
    --reruns 1
    --only-rerun ReadTimeoutError|MaxRetryError
markers =
    p0: smoke — гоняется на каждой сборке
    p1: регрессия
    p2: расширенное покрытие
    p3: косметика
    live: требует живого AO3
    replay: требует replay-прокси
    quarantine: нестабильный тест, вне гейта
    bridge: L2 device-free контракт-тест ao3_bridge.js против jsdom (docs/tasks/p2-pyramid-bridge.md N5) — несёт p1, вычитается из device-метрики фильтром "-m (p0 or p1) and not bridge" (Р5)
    produces_download: тест легитимно инициирует реальное скачивание файла(ов) в download-директорию приложения — download_oracle сверяет диф с ожиданием (count=N, дефолт 1 при голом маркере), а не бинарно; несовпадение (больше или меньше ожидания) -> fail (класс BUG-014 / liveness-детектор мёртвого зонда)
