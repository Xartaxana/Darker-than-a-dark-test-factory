# delegation.config.yaml — привязка Lead-функции к модели этого репо
# (порт D-0099 OS-репо: перепривязка Fable -> Opus 5, слово оператора
# 2026-08-15, чат: «и потом переключи лида на опус 5»).
#
# Единственный носитель Lead-привязки в этом репо. Читатели:
# scripts/mechanism_gate.py (commit-msg tier-гейт правила 10(б),
# resolve_lead_binding() — судит по HEAD-версии этого файла, не по
# рабочему дереву, см. _head_config_text()); scripts/log_append.py
# (lead-binding ветка матрицы приёмки D-0058 «Роль ≠ ярус», читает
# рабочее дерево — гейт не коммитный).
#
# Этот файл сам под самозащитой невода mechanism_gate.py
# (MECHANISM_PREFIXES) — тихая правка Lead-привязки требует осевого
# блока правила 10(б) и tier-строки, как и любой другой механизм; для
# коммита, трогающего именно этот файл, skip-ветка «оси: не-механизм»
# не действует безусловно (Р12).
#
# Отсутствие файла, отсутствие ключа roles.lead, битый/непарсящийся
# YAML, пустой model, нераспознанное или неоднозначное (≥2 разных)
# семейство модели, семейство ниже "opus" (санитарный пол калибровки
# №4 — координация ниже sonnet не предусмотрена матрицей) — всё это
# ЛЮБОЙ читатель резолвит в fail-safe дефолт "fable" с предупреждением
# в stderr (D-0072).

roles:
  # Lead-функция: декомпозиция, спеки, приёмка, механизмы. Перепривязана
  # с claude-fable-5 на claude-opus-5 (D-0099-порт, мотив OS — стоимость).
  lead:
    subscription:
      model: claude-opus-5

  # Резерв СТРОГО ВЫШЕ lead — зовётся только словом оператора под самые
  # тяжёлые задачи; все права Lead + подъём выше привязки (D-0099).
  reserve:
    subscription:
      model: claude-fable-5
